# Local Postgres for the API: ConnectionStrings__Postgres="Host=localhost;Port=5432;Username=veritrade;Password=veritrade;Database=veritrade"
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: veritrade, POSTGRES_PASSWORD: veritrade, POSTGRES_DB: veritrade }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
